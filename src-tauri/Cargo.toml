[package]
name = "bloxcreator"
version = "0.1.0"
description = "Blox Creator - offline GLSL shader block manager and assembler"
authors = ["Patrick JAILLET <sandefjord.development@proton.me>"]
license = "MIT"
edition = "2021"

[lib]
name = "bloxcreator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri               = { version = "2", features = [] }
tauri-plugin-dialog  = "2"
tauri-plugin-fs      = "2"
rusqlite             = { version = "0.31", features = ["bundled"] }
regex                = "1"
sha2                 = "0.10"
hex                  = "0.4"
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
thiserror            = "1"
once_cell            = "1"
